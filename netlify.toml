[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NPM_VERSION = "6.14.6"
  YARN_VERSION = "1.22.4"
  HUGO_ENV = "production"
  HUGO_VERSION = "0.76.5"
  NETLIFY_USE_YARN = "true"

[context.deploy-preview]
  command = "yarn build:preview"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.76.5"