[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.5.1"
  NPM_VERSION = "10.8.2"
  HUGO_ENV = "production"
  HUGO_VERSION = "0.128.2"

[context.deploy-preview]
  command = "npm run build:preview"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.128.2"