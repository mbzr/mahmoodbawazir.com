<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background-color: #ffffff;
        color: #1a1a1a;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
      }

      .role {
        font-size: 30px;
        line-height: 116%;
        letter-spacing: -0.02em;
        color: #6b6375;
      }

      .name {
        font-size: 132px;
        line-height: 0.95;
        letter-spacing: -0.04em;
        font-weight: 600;
      }

      .name span {
        display: block;
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .availability {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 30px;
        letter-spacing: -0.02em;
        color: #6b6375;
      }

      .rule {
        height: 1px;
        background-color: #e5e5e5;
        margin-bottom: 40px;
      }

      .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #15803d;
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <p class="role">Senior Frontend Developer</p>

    <h1 class="name"><span>Mahmood</span><span>Bawazir</span></h1>

    <div>
      <div class="rule"></div>
      <div class="foot">
        <p class="availability"><span class="dot"></span>Available now for contract or full-time roles</p>
      </div>
    </div>
  </body>
</html>
