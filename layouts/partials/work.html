<section class="work" id="work">
  <div class="work__header">
    <div class="container">
      <div class="row">
        <div class="col">
          <h2 class="text-primary" id="work-title"><span class="txt-up-wrap"><span class="txt-up">{{ .Params.projects.title }}</span></span></h2>
        </div>
        <div class="col">
          <p class="work__desc">{{ .Params.projects.description }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="work__container">
    <ul class="work__list">
      
      {{ range ($.Site.Pages.ByParam "year").Reverse }}
        {{ if isset .Params "year" }}
        <li class="work__item">
          <a href="{{ if isset .Params "external" }}{{ .Params.external }}{{ else }}{{ .Permalink }}{{ end }}" class="work__item__anchor{{ if isset .Params "external" }} no-xhr{{ end }}"{{ with .Params.img }} data-img="{{ . }}"{{ end }}>
            <span class="work__item__line-wrap">
              <span class="work__item__line"></span>
            </span>
            <span class="work__item__name-wrap">
              <span class="work__item__name">
                {{ .Title }}
              </span>
            </span>
            <span class="work__item__year-wrap">
              <!-- <span class="work__item__year">{{ .Params.year }}</span> -->
            </span>
          </a>
        </li>
        {{ end }}
      {{ end }}
    </ul>
  </div>
</section>
