<section class="work bg-color-dark" id="work">
  <div class="container">
    <div class="work-header">
      <h2 class="section-heading"><span class="txt-up-wrap"><span class="txt-up">Selected work</span></span></h2>
    </div>

    <div class="work-list">
      {{ range partial "project-list.html" . }}
        {{ $card := .Params.card }}
        <div class="work-item">
          <a href="{{ .RelPermalink }}" class="work-item-link">
            <div class="work-item-image">
              <div class="work-item-overlay"></div>
              <img src="{{ $card.image | relURL }}" alt="{{ $card.alt }}"
                   width="{{ $card.width }}" height="{{ $card.height }}"
                   class="work-item-img" loading="lazy" decoding="async">
            </div>
            <div class="work-item-content">
              <h3 class="work-item-title text-style-body"><span class="txt-up-wrap"><span class="txt-up">{{ .Title }}</span></span></h3>
              <p class="work-item-description text-style-body"><span class="txt-up-wrap"><span class="txt-up">{{ $card.subtitle }}</span></span></p>
            </div>
          </a>
        </div>
      {{ end }}
    </div>
  </div>
</section>
