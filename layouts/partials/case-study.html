{{/* Optional technical case study rows, using the existing detail-row layout. */}}
{{ $study := .Params.case_study }}
{{ range $study.sections }}
  <div class="case-block case-block--wide">
    <span class="case-block-line-wrap" aria-hidden="true"><span class="case-block-line"></span></span>
    <h2 class="case-block-title"><span class="txt-up-wrap"><span class="txt-up">{{ .heading }}</span></span></h2>
    <div class="case-study-copy">
      {{ with .text }}<p>{{ . }}</p>{{ end }}
      {{ with .items }}
        <ul role="list">
          {{ range . }}<li>{{ . }}</li>{{ end }}
        </ul>
      {{ end }}
    </div>
  </div>
{{ end }}
