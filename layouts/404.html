<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found</title>
  <style>

    @keyframes noise {
      0% {
        clip-path: inset(10% 0 100% 0);
      }
      20% {
        clip-path: inset(61% 10% 1% 0);
      }
      40% {
        clip-path: inset(43% 0 12% 0);
      }
      60% {
        clip-path: inset(25% 0 58% 10%);
      }
      80% {
        clip-path: inset(14% 0 7% 0);
      }
      100% {
        clip-path: inset(100% 10% 43% 0);
      }
    }
    html,body {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #1a1a1a;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
    }

    .not-found {
      position: relative;
      font-size: 152px;
      text-align: left;
      font-weight: 700;
      line-height: normal;
      display: block;
      color: inherit;
      margin-top: 0;
      margin-bottom: 30px;
    }

    .not-found::before,
    .not-found::after {
      content: attr(data-text);
      position: absolute;
      top: 0px;
      left: 0px;
      width: 100%;
      height: 100%;
    }

    .not-found::before {
      animation: 3s linear 0s infinite alternate-reverse none running noise;
      left: 2px;
      text-shadow: red -1px 0px;
      background: #ffffff;
    }

    .not-found::after {
      animation: 6s linear 0s infinite alternate-reverse none running noise;
      left: -2px;
      text-shadow: blue -1px 0px;
      background: #ffffff;
    }
    
    a {
      color: #ffffff;
      text-decoration: none;
      background-color: #2563eb;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  
  <div class="container">
    <h1 class="not-found" data-text="404">404</h1>
    <h2>Page not found</h2>
    <a href="/">Go to homepage</a>
  </div>

</body>
</html>
